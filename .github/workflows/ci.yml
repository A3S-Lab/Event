name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test all features
        run: cargo test --all-targets --all-features

      - name: Test minimal features
        run: cargo test --all-targets --no-default-features

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

      - name: Verify package contents
        run: cargo clippy --features iggy --no-default-features --all-targets -- -D warnings

      - name: Package
        run: cargo package

  jetstream:
    name: NATS JetStream 2.11.8
    runs-on: ubuntu-24.04
    env:
      A3S_EVENT_REQUIRE_NATS: "1"
      NATS_IMAGE: nats:2.11.8-alpine@sha256:71092f77d707a4a81b12aca5096d6b2d2e07ad16aa57c84066940a17af74f61a
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: jetstream

      - name: Start NATS with JetStream
        run: |
          docker run --detach \
            --name a3s-event-nats \
            --publish 4222:4222 \
            --publish 8222:8222 \
            "$NATS_IMAGE" \
            --jetstream \
            --http_port 8222

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              "http://127.0.0.1:8222/healthz?js-enabled-only=true" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs a3s-event-nats
          exit 1

      - name: Run real JetStream integration tests
        run: cargo test --test nats_integration -- --nocapture --test-threads=1

      - name: Show NATS logs after failure
        if: failure()
        run: docker logs a3s-event-nats

      - name: Stop NATS
        if: always()
        run: docker rm --force a3s-event-nats

  iggy:
    name: Apache Iggy 0.9.0
    runs-on: ubuntu-24.04
    env:
      A3S_EVENT_REQUIRE_BROKERS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: iggy

      # io_uring needs seccomp=unconfined; single shard + 2s rebalancing
      # keep the e2e suite fast (server contract documented in
      # tests/iggy_integration.rs and tests/e2e_chaos_resilience.rs).
      - name: Start Iggy
        run: |
          docker run --detach             --name a3s-event-iggy             --publish 5102:5102             --security-opt seccomp=unconfined             -e RUST_LOG=info             -e IGGY_ROOT_USERNAME=iggy             -e IGGY_ROOT_PASSWORD=iggy             -e IGGY_TCP_ADDRESS=0.0.0.0:5102             -e IGGY_NODE_ADVERTISED_ADDRESS=127.0.0.1             -e IGGY_SHARDING_CPU_ALLOCATION=1             -e IGGY_SHARDING_PIN_CORES=false             -e IGGY_CONSUMER_GROUP_REBALANCING_TIMEOUT=2s             apache/iggy:0.9.0

          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5102) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs a3s-event-iggy
          exit 1

      - name: Cross-provider conformance + iggy e2e
        run: cargo test --features nats,iggy --no-default-features --all-targets -- --test-threads=1

      - name: Show Iggy logs after failure
        if: failure()
        run: docker logs a3s-event-iggy

      - name: Stop Iggy
        if: always()
        run: docker rm --force a3s-event-iggy
